<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메모</title>
    <style>
        @font-face {
            font-family: "Pretendard";
            src: url("assets/fonts/PretendardVariable.woff2") format("woff2-variations");
            font-weight: 45 920;
            font-style: normal;
            font-display: swap;
        }

        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        body {
            font-family: "Pretendard", "Malgun Gothic", -apple-system, system-ui, sans-serif;
            background: #FFF8C8;                 /* 스티키 메모 느낌의 옅은 노랑 */
            display: flex; flex-direction: column;
            border: 1px solid #E8D98A;
            box-sizing: border-box;
        }

        /* 머리줄만 끌어서 옮긴다. 본문은 글자 선택이 돼야 하므로 no-drag */
        .bar {
            -webkit-app-region: drag;
            display: flex; align-items: center; gap: 6px;
            padding: 7px 8px 6px 12px;
            background: #FBEFA0;
            border-bottom: 1px solid #EEDF92;
            flex-shrink: 0;
        }
        .bar h1 {
            margin: 0; font-size: 12.5px; font-weight: 700; color: #6B5B14;
            letter-spacing: -0.01em; white-space: nowrap;
        }
        .bar .spacer { flex: 1; }

        .ctrl { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 4px; }
        .pin {
            display: flex; align-items: center; gap: 3px;
            font-size: 11px; font-weight: 700; color: #7A6A1E; cursor: pointer;
            padding: 2px 5px; border-radius: 4px; user-select: none;
        }
        .pin:hover { background: rgba(0,0,0,0.06); }
        .pin input { cursor: pointer; margin: 0; width: 12px; height: 12px; }

        .icon {
            border: none; background: transparent; cursor: pointer;
            width: 22px; height: 22px; border-radius: 4px;
            font-size: 12px; line-height: 1; color: #6B5B14;
            display: flex; align-items: center; justify-content: center;
        }
        .icon:hover { background: rgba(0,0,0,0.08); }
        .icon.close:hover { background: #E74C3C; color: #fff; }

        /* 창 전체가 곧 메모칸 */
        #memo {
            -webkit-app-region: no-drag;
            flex: 1; width: 100%; box-sizing: border-box;
            border: none; outline: none; resize: none;
            background: transparent; color: #3B3413;
            font-family: inherit; font-size: 14px; line-height: 1.65;
            padding: 12px 14px;
        }
        #memo::placeholder { color: #B7A85E; }

        .status {
            -webkit-app-region: no-drag;
            flex-shrink: 0; padding: 4px 12px 7px;
            font-size: 10.5px; color: #A2924A; text-align: right; min-height: 14px;
        }
    </style>
</head>
<body>
    <div class="bar">
        <h1>📝 메모</h1>
        <div class="spacer"></div>
        <div class="ctrl">
            <label class="pin" title="항상 맨 위에 두기">
                <input type="checkbox" id="alwaysOnTop" checked> 위
            </label>
            <button class="icon close" onclick="closeSelf()" title="메모 닫기">✖</button>
        </div>
    </div>

    <textarea id="memo" placeholder="여기에 적으면 메모장 탭과 같이 저장됩니다."></textarea>
    <div class="status" id="status"></div>

    <script>
        const { ipcRenderer } = require('electron');

        const $ = id => document.getElementById(id);
        let memoSaveTimer = null;

        function closeSelf() { window.close(); }

        $('alwaysOnTop').addEventListener('change', function () {
            ipcRenderer.send('set-always-on-top', this.checked);
        });

        function setStatus(text) { $('status').innerText = text; }

        function persistMemo() {
            ipcRenderer.send('save-sections', { memoPadData: $('memo').value });
            const d = new Date(), p = n => String(n).padStart(2, '0');
            setStatus('저장됨 · ' + p(d.getHours()) + ':' + p(d.getMinutes()));
        }

        // 📌 글자마다 저장하면 파일 쓰기가 과해진다. 0.5초 쉴 때 한 번만 저장한다.
        $('memo').addEventListener('input', function () {
            setStatus('입력 중…');
            if (memoSaveTimer) clearTimeout(memoSaveTimer);
            memoSaveTimer = setTimeout(() => {
                memoSaveTimer = null;
                persistMemo();
            }, 500);
        });

        function flushMemoSave() {
            if (memoSaveTimer) {
                clearTimeout(memoSaveTimer);
                memoSaveTimer = null;
                persistMemo();
            }
        }
        $('memo').addEventListener('blur', flushMemoSave);
        window.addEventListener('blur', flushMemoSave);
        window.addEventListener('beforeunload', flushMemoSave);

        // 📌 저장 대기 중인 내 입력이 없을 때만 다른 창의 내용을 받아 넣는다.
        // 그래야 여기서 치는 중에 글자가 덮이지 않는다.
        ipcRenderer.on('sync-sections', (event, patch) => {
            if (!patch || patch.memoPadData === undefined) return;
            const el = $('memo');
            if (memoSaveTimer || el.value === patch.memoPadData) return;
            const pos = el.selectionStart;
            el.value = patch.memoPadData;
            try { el.setSelectionRange(pos, pos); } catch (e) {}
        });

        async function init() {
            const doc = await ipcRenderer.invoke('load-data');
            if (doc && doc.memoPadData !== undefined) $('memo').value = doc.memoPadData;
            setStatus('');
            $('memo').focus();
        }

        init();
    </script>
</body>
</html>

[package]
name = "task-manager"
version = "0.1.0"
description = "Task Manager (Tauri 시험판)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 📌 용량이 이 시험의 목적이므로 크기 우선으로 맞춘다.
#    opt-level "s" 속도보다 크기 / lto 쓰지 않는 코드 제거 /
#    codegen-units 1 더 많이 뭉쳐서 줄임 / strip 디버그 기호 삭제
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Quick Contact</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: transparent; overflow: hidden;
            user-select: none; cursor: pointer;
        }
        #btn {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(145deg, #3aa9f0, #1f6fb0);
            box-shadow: 0 3px 10px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; line-height: 1;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        #btn:hover { transform: scale(1.07); box-shadow: 0 5px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4); }
        #btn.dragging { transform: scale(1.12); cursor: grabbing; }
        @media (prefers-reduced-motion: reduce) { #btn { transition: none; } }
    </style>
</head>
<body>
    <div id="btn" title="클릭: 빠른 등록 / 끌기: 위치 이동 / 우클릭: 메뉴">📞</div>

    <script>
        const { ipcRenderer } = require('electron');
        const btn = document.getElementById('btn');

        // 📌 클릭과 드래그를 구분한다. 이게 없으면 옮기려다 창이 뜬다.
        // 5px 이상 움직였으면 이동, 아니면 열기.
        const DRAG_THRESHOLD = 5;
        let dragging = false, startX = 0, startY = 0, moved = 0;

        btn.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            dragging = true;
            moved = 0;
            startX = e.screenX;
            startY = e.screenY;
            btn.classList.add('dragging');
            // 포인터를 붙잡아 둬야 56px 창 밖으로 나가도 move 이벤트가 계속 온다.
            try { btn.setPointerCapture(e.pointerId); } catch (err) {}
            ipcRenderer.send('phone-drag-start');
        });

        btn.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const dx = e.screenX - startX;
            const dy = e.screenY - startY;
            moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
            if (moved >= DRAG_THRESHOLD) ipcRenderer.send('phone-drag-move', { dx, dy });
        });

        btn.addEventListener('pointerup', (e) => {
            if (!dragging) return;
            dragging = false;
            btn.classList.remove('dragging');
            try { btn.releasePointerCapture(e.pointerId); } catch (err) {}

            if (moved < DRAG_THRESHOLD) ipcRenderer.send('open-quick-add');
            else ipcRenderer.send('phone-drag-end');
        });

        btn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            ipcRenderer.send('phone-context-menu');
        });
    </script>
</body>
</html>
